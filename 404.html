            gold: { DEFAULT: '#b0a171' },
            charcoal: { DEFAULT: '#1a1715' }
          },
          fontFamily: {
            serif: ['"EB Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
